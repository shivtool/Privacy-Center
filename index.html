<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy Policies | Shiv Computer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0a0a0f;
    --bg-1:#101018;
    --glass:rgba(255,255,255,0.04);
    --glass-border:rgba(255,255,255,0.09);
    --gold:#d4af37;
    --gold-soft:#f2d675;
    --text:#e9e9ef;
    --text-dim:#a3a3b0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Poppins',sans-serif;
    color:var(--text);
    background:
      radial-gradient(1100px 600px at 15% -10%, rgba(212,175,55,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(212,175,55,0.06), transparent 55%),
      linear-gradient(180deg,var(--bg-0),var(--bg-1));
    min-height:100vh;
  }
  header{
    padding:56px 20px 30px;
    text-align:center;
  }
  header .brand{
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    letter-spacing:.08em;
    color:var(--gold-soft);
    font-size:14px;
    text-transform:uppercase;
    margin-bottom:10px;
  }
  header h1{
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    font-size:clamp(28px,4vw,44px);
    margin:0 0 10px;
    background:linear-gradient(90deg,#fff,var(--gold-soft));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header p{color:var(--text-dim);margin:0;font-size:15px;max-width:560px;margin:0 auto;}
  main{
    max-width:760px;
    margin:0 auto;
    padding:20px 20px 80px;
  }
  #search{
    width:100%;
    padding:14px 18px;
    border-radius:12px;
    border:1px solid var(--glass-border);
    background:var(--glass);
    color:var(--text);
    font-family:'Poppins',sans-serif;
    font-size:14px;
    margin-bottom:26px;
    outline:none;
  }
  #search::placeholder{color:var(--text-dim);}
  #search:focus{border-color:var(--gold);}
  .policy-list{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .policy-card{
    display:flex;
    align-items:center;
    gap:16px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:16px;
    padding:18px 22px;
    text-decoration:none;
    color:var(--text);
    backdrop-filter:blur(12px);
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .policy-card:hover{
    transform:translateY(-2px);
    border-color:rgba(212,175,55,0.5);
    background:rgba(212,175,55,0.05);
  }
  .policy-icon{
    width:44px;height:44px;
    flex:0 0 44px;
    border-radius:12px;
    background:linear-gradient(135deg,var(--gold),#8a6d1e);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
  }
  .policy-info{flex:1;min-width:0;}
  .policy-info .name{
    font-family:'Rajdhani',sans-serif;
    font-weight:600;
    font-size:17px;
    color:#fff;
    margin-bottom:2px;
  }
  .policy-info .pkg{
    font-size:12.5px;
    color:var(--text-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .arrow{
    color:var(--gold-soft);
    font-size:20px;
    flex:0 0 auto;
  }
  #empty{
    text-align:center;
    color:var(--text-dim);
    padding:30px 0;
    display:none;
    font-size:14px;
  }
  footer{
    text-align:center;
    padding:20px;
    color:var(--text-dim);
    font-size:13px;
  }
</style>
</head>
<body>

<header>
  <div class="brand">Shiv Computer</div>
  <h1>Privacy Policies</h1>
  <p>Privacy policies for all apps and tools published by Shiv Computer.</p>
</header>

<main>
  <input type="text" id="search" placeholder="Search an app...">
  <div class="policy-list" id="policy-list"></div>
  <div id="empty">No matching app found.</div>
</main>

<footer>© 2026 Shiv Computer. All rights reserved.</footer>

<script>
  /* ============================================================
     ADD A NEW PRIVACY POLICY HERE — nothing else needs to change.
     Just add one object to this array:
       {
         name:    "App Name",                 // shown as title
         package: "com.example.package",      // shown as subtitle
         file:    "privacy-policy-app.html",  // link to that app's policy page
         icon:    "🧮"                         // any emoji as the icon
       }
     ============================================================ */
  const policies = [
    {
      name: "Calculation",
      package: "com.shivcomputer.calculatorsuite",
      file: "privacy-policy-calculation.html",
      icon: "🧮"
    }
    // Add more apps below, e.g.:
    // {
    //   name: "Khata Book",
    //   package: "com.shivcomputer.khatabook",
    //   file: "privacy-policy-khatabook.html",
    //   icon: "📒"
    // },
  ];

  const listEl = document.getElementById('policy-list');
  const emptyEl = document.getElementById('empty');
  const searchEl = document.getElementById('search');

  function render(items) {
    listEl.innerHTML = '';
    if (items.length === 0) {
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';
    items.forEach(p => {
      const a = document.createElement('a');
      a.className = 'policy-card';
      a.href = p.file;
      a.innerHTML = `
        <div class="policy-icon">${p.icon || '📄'}</div>
        <div class="policy-info">
          <div class="name">${p.name}</div>
          <div class="pkg">${p.package}</div>
        </div>
        <div class="arrow">→</div>
      `;
      listEl.appendChild(a);
    });
  }

  searchEl.addEventListener('input', () => {
    const q = searchEl.value.trim().toLowerCase();
    const filtered = policies.filter(p =>
      p.name.toLowerCase().includes(q) || p.package.toLowerCase().includes(q)
    );
    render(filtered);
  });

  render(policies);
</script>

</body>
</html>
